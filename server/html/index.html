

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习导航</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 600px;
            width: 90%;
            padding: 20px;
        }
        .card {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #4a4a4a;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-size: 24px;
            font-weight: bold;
            flex-direction: column;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        .card-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        /* Specific Styles */
        .math {
            border-bottom: 5px solid #FF6B6B;
        }
        .math:hover {
            color: #FF6B6B;
            border-color: #FF6B6B;
        }
        .math .card-icon { color: #FF6B6B; }

        .english {
            border-bottom: 5px solid #4ECDC4;
        }
        .english:hover {
            color: #4ECDC4;
            border-color: #4ECDC4;
        }
        .english .card-icon { color: #4ECDC4; }

        .chinese {
            border-bottom: 5px solid #45B7D1;
        }
        .chinese:hover {
            color: #45B7D1;
            border-color: #45B7D1;
        }
        .chinese .card-icon { color: #45B7D1; }

        .general {
            border-bottom: 5px solid #96CEB4;
        }
        .general:hover {
            color: #96CEB4;
            border-color: #96CEB4;
        }
        .general .card-icon { color: #96CEB4; }

        @media (max-width: 500px) {
            .container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .card {
                aspect-ratio: auto;
                height: 120px;
                flex-direction: row;
                justify-content: flex-start;
                padding-left: 30px;
            }
            .card-icon {
                margin-bottom: 0;
                margin-right: 20px;
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="math" class="card math">
            <div class="card-icon">∑</div>
            <div>数学</div>
        </a>
        <a href="english.html" class="card english">
            <div class="card-icon">Abc</div>
            <div>英文</div>
        </a>
        <a href="chinese.html" class="card chinese">
            <div class="card-icon">文</div>
            <div>语文</div>
        </a>
        <a href="general.html" class="card general">
            <div class="card-icon">💡</div>
            <div>常识</div>
        </a>
    </div>

    <script>
        function getDeviceId() {
            let deviceId = localStorage.getItem('app_device_id');
            if (!deviceId) {
                // 生成一个 UUID (v4)
                deviceId = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
                localStorage.setItem('app_device_id', deviceId);
            }
            return deviceId;
        }

        // 页面加载完成后，给 math 链接加上 deviceId
        document.addEventListener('DOMContentLoaded', () => {
            const deviceId = getDeviceId();
            const mathLink = document.querySelector('a[href="math"]');
            if (mathLink) {
                // 判断原本是否已有参数
                const separator = mathLink.href.includes('?') ? '&' : '?';
                mathLink.href = mathLink.href + separator + 'deviceId=' + deviceId;
            }
        });
    </script>
</body>
</html>

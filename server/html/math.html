<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学专题选择</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        .card {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: #333;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 150px;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .btn {
            flex: 1;
            padding: 8px 0;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
            cursor: pointer;
            border: none;
            display: inline-block;
        }
        .btn-practice {
            background-color: #e3f2fd;
            color: #1976d2;
        }
        .btn-practice:hover {
            background-color: #bbdefb;
        }
        .btn-challenge {
            background-color: #fff3e0;
            color: #f57c00;
        }
        .btn-challenge:hover {
            background-color: #ffe0b2;
        }
        
        /* Optional: Add some subtle colors to cards for variety */
        .card:nth-child(1) { border-top: 4px solid #FF6B6B; }
        .card:nth-child(2) { border-top: 4px solid #4ECDC4; }
        .card:nth-child(3) { border-top: 4px solid #45B7D1; }
        .card:nth-child(4) { border-top: 4px solid #96CEB4; }
        .card:nth-child(5) { border-top: 4px solid #FFEEAD; }
        .card:nth-child(6) { border-top: 4px solid #D4A5A5; }
        .card:nth-child(7) { border-top: 4px solid #9B59B6; }
        .card:nth-child(8) { border-top: 4px solid #3498DB; }
    </style>
</head>
<body>

<div class="grid-container">
    {{range .Items}}
    <div class="card">
        <div class="card-title">{{.Title}}</div>
        <div class="button-group">
            <a href="selection?tag={{.Tag}}" class="btn btn-practice">练习</a>
            <a href="examination?tag={{.Tag}}" class="btn btn-challenge">闯关</a>
        </div>
    </div>
    {{end}}
</div>

</body>
</html>

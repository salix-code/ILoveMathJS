<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SimSun', '宋体', serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        /* A4 纸张大小 210mm x 297mm */
        .page {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20mm;
            position: relative;
        }

        /* 页眉 */
        .header {
            text-align: center;
            margin-bottom: 20px; /* 从 30px 调小 */
            border-bottom: 2px solid #333;
            padding-bottom: 12px; /* 从 15px 调小 */
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header .subtitle {
            font-size: 14px;
            color: #666;
        }

        /* 学生信息栏 */
        .student-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #fafafa;
        }

        .student-info .info-item {
            font-size: 14px;
        }

        .student-info .info-item span {
            display: inline-block;
            min-width: 100px;
            border-bottom: 1px solid #333;
            margin-left: 5px;
        }

        /* 题目容器 */
        .questions-container {
            margin-top: 20px;
        }

        /* 单个题目 */
        .question {
            margin-bottom: 16px; /* 从 40px 调小为 16px */
            page-break-inside: avoid;
        }

        .question-header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .question-number {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            min-width: 40px;
        }

        .question-content {
            flex: 1;
            font-size: 15px;
            line-height: 1.8;
            color: #333;
        }

        /* 答题区域 */
        .answer-area {
            margin-top: 10px; /* 从 15px 调小 */
            padding-left: 36px; /* 轻微调小 */
        }

        .answer-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .answer-lines {
            border-top: 1px solid #ddd;
            padding-top: 8px; /* 从 10px 调小 */
        }

        .answer-line {
            height: 22px; /* 从 30px 调小 */
            border-bottom: 1px dashed #ccc;
            margin-bottom: 8px; /* 从 10px 调小 */
        }

        /* 分隔线 */
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #ddd, transparent);
            margin: 18px 0; /* 从 30px 调小 */
        }

        /* 页脚 */
        .footer {
            position: absolute;
            bottom: 15mm;
            left: 20mm;
            right: 20mm;
            text-align: center;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }

        /* 打印样式 */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .page {
                width: 210mm;
                height: 297mm;
                margin: 0;
                box-shadow: none;
                page-break-after: always;
            }

            .page:last-child {
                page-break-after: auto;
            }
        }

        /* 题目类型标签 */
        .question-type {
            display: inline-block;
            padding: 2px 8px;
            background-color: #e3f2fd;
            color: #1976d2;
            border-radius: 3px;
            font-size: 12px;
            margin-left: 10px;
        }

        /* 难度标签 */
        .difficulty {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            margin-left: 5px;
        }

        .difficulty.easy {
            background-color: #c8e6c9;
            color: #2e7d32;
        }

        .difficulty.medium {
            background-color: #fff9c4;
            color: #f57f17;
        }

        .difficulty.hard {
            background-color: #ffcdd2;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- 页眉 -->
        <div class="header">
            <h1>{{.Title}}</h1>
            <!-- 难度显示已移除 -->
        </div>

        

        <!-- 题目容器 -->
        <div class="questions-container" id="questionsContainer">
            {{range .Questions}}
            <div class="question">
                <div class="question-header">
                    <span class="question-number">{{.number}}.</span>
                    <div class="question-content">
                        {{.content}}
                        <!-- 难度标识已删除 -->
                    </div>
                </div>
                <div class="answer-area">
                    <div class="answer-label">答：</div>
                    
                </div>
            </div>
            {{if ne .number (len $.Questions)}}
            <div class="divider"></div>
            {{end}}
            {{end}}
        </div>

    </div>
</body>
</html>
